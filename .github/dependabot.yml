# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#scheduleinterval
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        # Group routine bumps together, but split the framework majors out so
        # they land as individual PRs and get real one-at-a-time runtime review
        # rather than being rubber-stamped on green clippy inside the group.
        patterns:
          - "*"
        exclude-patterns:
          - "lambda_runtime"
          - "lambda_http"
          - "axum"
          - "tower"
        update-types:
          - "major"
          - "minor"
          - "patch"
    commit-message:
      prefix: "⬆️ cargo:"
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "major"
          - "minor"
          - "patch"
    commit-message:
      prefix: "⬆️ gha:"
    cooldown:
      default-days: 14
