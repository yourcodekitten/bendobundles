name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ["8000:8000"]
    env:
      DYNAMODB_LOCAL_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # step-security forks are the org pattern, but they hard-fail on PRIVATE repos without a
      # StepSecurity subscription (verified: run 2026-07-02, "requires a StepSecurity subscription
      # for private repositories"). Until this repo goes public (or gets a subscription), the
      # SHA-pinned upstreams stay. Swap back to step-security/* when visibility changes.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # wreq's TLS impersonation pulls boring-sys, which compiles BoringSSL (cmake)
      # and generates bindings (libclang). ubuntu-latest usually has these, but pin
      # them explicitly so a runner-image change can't silently break the build.
      - name: install BoringSSL build deps (wreq/boring-sys)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # --no-fail-fast: a truncated failure census is indistinguishable from a complete
      # one (#185, paid for in #180 — the second broken crate compiled, never ran, and
      # its red later read as a fresh regression).
      - run: cargo test --workspace --no-fail-fast
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web

  # Dependency advisories surface on their own instead of via a quarterly audit (#81).
  # Ignores live in .cargo/audit.toml (rust) and web/scripts/npm-audit-check.sh (npm) — both
  # dated + commented; anything NEW fails this job.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: ./scripts/npm-audit-check.sh
        working-directory: web

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.2"
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  artifacts:
    # NATIVE arm64 runner (not x86). wreq pulls boring-sys, which compiles BoringSSL's C via cmake.
    # On an x86 runner, cross-compiling that to aarch64 makes boring-sys's cmake toolchain pass
    # `--target=aarch64-...` to `/usr/bin/cc` (x86 GCC), which rejects it — a clang/zig-only flag.
    # Building on a native arm64 runner sidesteps the C cross-compile entirely (host == target), the
    # exact path proven locally; cargo-lambda still links via zig, pinning glibc low for al2023.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Native aarch64 BoringSSL build (cmake) + bindgen (libclang). No cross-compile flags involved.
      - name: install BoringSSL build deps (wreq/boring-sys)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: install cargo-lambda
        run: pip3 install cargo-lambda
      - run: |
          for bin in public-api admin-api fulfillment; do
            cargo lambda build --release --arm64 --output-format zip --bin "$bin"
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-zips
          path: target/lambda/*/bootstrap.zip
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          retention-days: 14

  # Expected-usage cost estimate (org-module pattern, standalone body: the org
  # reusable carries step-security/harden-runner, which hard-fails on private
  # repos — same caveat as the comment on the test job). Gated on the
  # INFRACOST_API_KEY secret so CI stays green until it's configured; once set,
  # the job posts/updates a cost comment on PRs.
  infracost:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: gate on API key
        id: gate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::INFRACOST_API_KEY not set — skipping cost estimate"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        if: steps.gate.outputs.has_key == 'true'
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.has_key == 'true'
        with:
          persist-credentials: false
      - name: cost breakdown
        if: steps.gate.outputs.has_key == 'true'
        run: |
          infracost breakdown --config-file=infracost.yml --format=table
          infracost breakdown --config-file=infracost.yml --format=json --out-file=/tmp/infracost.json
      - name: post cost comment
        if: steps.gate.outputs.has_key == 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          infracost comment github --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --github-token="$GITHUB_TOKEN" \
            --behavior=update
