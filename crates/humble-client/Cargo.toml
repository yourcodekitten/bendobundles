[package]
name = "humble-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Non-optional + `time`: choice_months paces its walk (tokio::time::sleep) and bounds it with a
# deadline (tokio::time::Instant). The workspace default lacks `time`, so add it here.
tokio = { workspace = true, features = ["time"] }
tracing = "0.1"
uuid.workspace = true
wreq = { version = "5.3.0", features = ["json", "cookies", "gzip"] }
wreq-util = "2.2.6"
# secure-area step-up: a humble app-TOTP (RFC 6238, SHA1/6/30s) over the base32 seed.
# All pure-Rust (RustCrypto + data-encoding) — no C, so the boring-sys cross-build is untouched.
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

[dev-dependencies]
tokio.workspace = true
wiremock = "0.6"

[features]
# tokio is now always available; the feature only gates the probe bin below.
probe = []

[[bin]]
name = "probe"
required-features = ["probe"]
