[package]
name = "dynamo"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
aws-sdk-dynamodb = "1"
# session_pk hashes tokens at rest (#88): a table read yields digests, never replayable
# bearer tokens. Version matches the workspace lockfile.
sha2 = "0.11"
domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
steam-client = { path = "../steam-client" }
thiserror.workspace = true
time.workspace = true
# create_table_for_tests' ACTIVE waiter sleeps between polls (#168 mechanism a). The
# `time` feature is declared here explicitly rather than trusted to transitive
# unification; weight-free at runtime — every consumer binary already carries tokio.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
aws-config = { version = "1", features = ["behavior-version-latest", "test-util"] }
# iam_capture.rs only: request-shape interceptor (#70). Both are already in the tree as
# transitive deps of the SDK; pinning "1" keeps them lockstep with aws-sdk-dynamodb.
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
steam-client = { path = "../steam-client" }
tokio.workspace = true
uuid.workspace = true

[features]
# Gates delete_game — compiled ONLY for the heal_choice_pairs operator bin, never the
# lambda build, so "the sync path never deletes" is a compiler guarantee (spec Q5).
heal = []
