# cargo-audit config — dated, commented ignores ONLY (#81). An entry here is a
# documented block, not a dismissal: each names why it's unreachable/unfixable
# today and what event retires it. CI's audit job fails on anything NOT listed.
# NOTE: this is one of TWO advisory parking lots — npm advisories live in
# web/scripts/npm-audit-check.sh's ALLOWLIST. Check both to see the full story.
#
# THE HAZARD BOTH LISTS SHARE (#178): `ignore` matches on ADVISORY ID, with no
# version awareness — same as the npm side. An entry therefore does not suppress
# "this advisory at the version we're pinned to", it suppresses **that ID for every
# version this repo will ever resolve**. So a retire condition that has FIRED is not
# stale documentation, it is a live hole: the advisory can come back through a
# different version and this list will wave it through silently. The npm side had
# exactly that happen — its react-router entry was patched-and-inert on 7.x while the
# SAME advisory stayed unpatched below 8.3.0, so an 8.x upgrade would have re-entered
# the bug against a green check. Re-check the conditions below whenever you touch
# these deps; do not assume a parked entry is still earning its place.
# Verified 2026-08-21: the three legacy-TLS entries' condition has FIRED (all three
# crates at 0 occurrences after #199) and they have been retired — see below. The lru
# entry's condition has NOT fired: lru 0.13.0 still arrives under wreq, measured 1
# occurrence, so it remains justified. Re-measure both before trusting this line.
[advisories]
ignore = [
    # RETIRED 2026-08-21. The three legacy-TLS ignores that lived here (a CRL-parsing
    # panic and two name-constraint advisories) were parked on the condition "retire when
    # an SDK bump drops the legacy chain from the lock". PR #199 dropped it: hyper-rustls
    # 0.24, rustls 0.21 and rustls-webpki 0.101 are all at 0 occurrences in Cargo.lock.
    # Per this file's own header a FIRED retire condition is a live hole, not stale
    # documentation — `ignore` matches on advisory ID with no version awareness, so those
    # three IDs would have been waved through at ANY future version this repo resolves.
    # scripts/no-legacy-http-stack.sh now asserts that chain stays out.
    # lru 0.13.0 IterMut unsoundness (informational). Pinned by wreq 5.3 → lru 0.13;
    # not expressible as a direct bump. Retire on a wreq release that moves lru.
    "RUSTSEC-2026-0002",
]
